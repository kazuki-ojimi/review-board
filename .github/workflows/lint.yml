name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff format
        run: uv run ruff format --check src/ tests/

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run pyright
        run: uv run pyright

      - name: Run pytest
        run: uv run pytest
