# Kept separate from open_prs.graphql and merged_prs.graphql: nesting those
# searches here exceeded GitHub's ~10 s GraphQL timeout (HTTP 502, measured 2026-11).
query Activity($authored: String!, $reviewed: String!, $limit: Int!) {
  viewer {
    login
    repositoriesContributedTo(
      first: 100
      includeUserRepositories: true
      contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, PULL_REQUEST_REVIEW]
    ) {
      totalCount
      nodes {
        nameWithOwner
        isArchived
      }
    }
  }
  authored: search(query: $authored, type: ISSUE, first: $limit) {
    issueCount
    nodes {
      ...PullRequestActivity
    }
  }
  reviewed: search(query: $reviewed, type: ISSUE, first: $limit) {
    issueCount
    nodes {
      ...PullRequestActivity
    }
  }
}

fragment PullRequestActivity on PullRequest {
  number
  title
  url
  isDraft
  createdAt
  updatedAt
  reviewDecision
  author {
    login
  }
  repository {
    nameWithOwner
  }
  comments(last: 50) {
    nodes {
      author {
        login
      }
      createdAt
      ...ViewerReactions
    }
  }
  reviews(last: 50) {
    nodes {
      author {
        login
      }
      state
      body
      submittedAt
      ...ViewerReactions
    }
  }
  reviewThreads(last: 50) {
    nodes {
      isResolved
      starter: comments(first: 1) {
        nodes {
          author {
            login
          }
        }
      }
      comments(last: 30) {
        nodes {
          author {
            login
          }
          createdAt
          state
          ...ViewerReactions
        }
      }
    }
  }
  commits(last: 1) {
    nodes {
      commit {
        committedDate
        author {
          user {
            login
          }
        }
      }
    }
  }
}

# Reactions the viewer can leave to mark a comment as handled without replying.
fragment ViewerReactions on Reactable {
  reactionGroups {
    content
    viewerHasReacted
  }
}
